<div class="row">
    <div class="col-md-6">
        <div class="module-card">
            <div class="module-header">
                <h5><i class="fas fa-coins me-2"></i>資源類型管理</h5>
            </div>
            <div class="module-body">
                <form id="resourceTypeFullForm">
                    <input type="hidden" id="resourceTypeEditId">
                    <div class="mb-2">
                        <label>資源ID</label>
                        <input type="text" class="form-control" id="resourceTypeId">
                    </div>
                    <div class="mb-2">
                        <label>名稱 (中文)</label>
                        <input type="text" class="form-control" id="resourceTypeNameZh">
                    </div>
                    <div class="mb-2">
                        <label>名稱 (英文)</label>
                        <input type="text" class="form-control" id="resourceTypeNameEn">
                    </div>
                    <div class="mb-2">
                        <label>描述 (中文)</label>
                        <input type="text" class="form-control" id="resourceTypeDescZh">
                    </div>
                    <div class="mb-2">
                        <label>描述 (英文)</label>
                        <input type="text" class="form-control" id="resourceTypeDescEn">
                    </div>
                    <div class="mb-2">
                        <label>圖示URL</label>
                        <input type="text" class="form-control" id="resourceTypeIconURL">
                    </div>
                    <div class="mb-2">
                        <label>Premium</label>
                        <select class="form-select" id="resourceTypePremium">
                            <option value="false">否</option>
                            <option value="true">是</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label>Stackable</label>
                        <select class="form-select" id="resourceTypeStackable">
                            <option value="true">可堆疊</option>
                            <option value="false">不可堆疊</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label>分類</label>
                        <input type="text" class="form-control" id="resourceTypeCategory">
                    </div>
                    <div class="mb-2">
                        <label>排序</label>
                        <input type="number" class="form-control" id="resourceTypeSortOrder">
                    </div>
                    <div class="mb-2">
                        <label>基礎產量</label>
                        <input type="number" class="form-control" id="resourceTypeBaseProductionRate">
                    </div>
                    <div class="mb-2">
                        <label>初始數量</label>
                        <input type="number" class="form-control" id="resourceTypeNowAmount">
                    </div>
                    <div class="mb-2">
                        <label>最大數量</label>
                        <input type="number" class="form-control" id="resourceTypeMaxAmount">
                    </div>
                    <div class="mb-2">
                        <label>保護倉庫百分比</label>
                        <input type="number" step="0.01" class="form-control" id="resourceTypeProtectedStoragePercentage">
                    </div>
                    <div class="mb-2">
                        <label>保護倉庫最大量</label>
                        <input type="number" class="form-control" id="resourceTypeProtectedStorageMaxAmount">
                    </div>
                    <div class="mb-2">
                        <label>取得方式 (逗號分隔)</label>
                        <input type="text" class="form-control" id="resourceTypeAcquisitionMethods">
                    </div>
                    <button type="button" class="btn btn-module btn-primary" onclick="saveResourceTypeFull()">儲存/新增</button>
                    <button type="button" class="btn btn-module btn-danger ms-2" onclick="deleteResourceTypeFull()">刪除</button>
                    <button type="button" class="btn btn-module btn-secondary ms-2" onclick="clearResourceTypeFullForm()">清除</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="module-card">
            <div class="module-header">
                <h5><i class="fas fa-list me-2"></i>資源類型列表</h5>
            </div>
            <div class="module-body">
                <ul class="list-group mb-2" id="resourceTypeFullList"></ul>
                <button type="button" class="btn btn-module btn-info w-100 mt-3" onclick="loadResourceTypeFullList()">
                    <i class="fas fa-sync me-2"></i>重新載入
                </button>
            </div>
        </div>
    </div>
</div>
