<div class="row">
  <div class="col-md-6">
    <div class="module-card">
      <div class="module-header">
        <h5><i class="fas fa-user me-2"></i>玩家管理</h5>
      </div>
      <div class="module-body">
        <form (submit)="$event.preventDefault()">
          <div class="mb-3">
            <label class="form-label">玩家名稱</label>
            <input type="text" class="form-control" [(ngModel)]="playerName" name="playerName" placeholder="請輸入玩家名稱">
          </div>
          <button type="button" class="btn btn-module btn-primary" (click)="createPlayer()">
            <i class="fas fa-user-plus me-2"></i>創建玩家
          </button>
        </form>
        <div class="mt-2 text-info">{{ message }}</div>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="module-card">
      <div class="module-header">
        <h5><i class="fas fa-users me-2"></i>玩家列表</h5>
      </div>
      <div class="module-body">
        <div *ngIf="players.length > 0; else noPlayers">
          <ul class="list-group mb-3">
            <li *ngFor="let player of players" class="list-group-item d-flex justify-content-between align-items-center">
              <span>
                {{ player.name }}
                <span *ngIf="player.incomplete" class="badge bg-warning ms-2">資料不完整</span>
                <span *ngIf="!player.incomplete">
                  <span *ngIf="player.status === 1" class="badge rounded-circle bg-success ms-2" style="width:16px;height:16px;display:inline-block;"></span>
                  <span *ngIf="player.status === 0" class="badge rounded-circle bg-danger ms-2" style="width:16px;height:16px;display:inline-block;"></span>
                </span>
              </span>
              <span>
                <button class="btn btn-sm btn-success me-1" (click)="setPlayerOnline(player.id)" [disabled]="player.status === 1">上線</button>
                <button class="btn btn-sm btn-secondary" (click)="setPlayerOffline(player.id)" [disabled]="player.status === 0">下線</button>
              </span>
            </li>
          </ul>
        </div>
        <ng-template #noPlayers>
          <p class="text-muted">沒有玩家資料</p>
        </ng-template>
        <button type="button" class="btn btn-module btn-info w-100 mt-3" (click)="loadPlayers()">
          <i class="fas fa-sync me-2"></i>重新載入
        </button>
      </div>
    </div>
  </div>
</div>
