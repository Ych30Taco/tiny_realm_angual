<div class="row">
    <div class="col-md-8">
        <!-- 地圖預覽 -->
        <div class="module-card">
            <div class="module-header">
                <h5><i class="fas fa-map-marked-alt me-2"></i>地圖預覽</h5>
            </div>
            <div class="module-body">
                <div class="map-preview">
                    <div class="terrain-grid" id="terrainGrid">
                        <!-- 地形格子將由JavaScript動態生成 -->
                    </div>
                </div>
                <div class="text-center mt-3">
                    <div class="input-group mb-2" style="max-width: 220px; margin: 0 auto;">
                        <span class="input-group-text">地圖大小</span>
                        <input type="number" class="form-control" id="mapSizeInput" min="5" max="100" value="10">
                    </div>
                    <button class="btn btn-module btn-info" onclick="generateRandomMap()">
                        <i class="fas fa-random me-2"></i>生成隨機地圖預覽
                    </button>
                    <button class="btn btn-module btn-secondary ms-2" onclick="loadMapFromConfig()">
                        <i class="fas fa-file-import me-2"></i>載入配置地圖
                    </button>
                    <button class="btn btn-module btn-warning ms-2" onclick="overrideWithConfigMap()">
                        <i class="fas fa-save me-2"></i>覆蓋地圖
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <!-- 選中格子資訊 -->
        <div class="module-card mb-3" id="selectedTileInfo" style="display: none;">
            <div class="module-header">
                <h5><i class="fas fa-info-circle me-2"></i>選中格子資訊</h5>
            </div>
            <div class="module-body">
                <div id="tileInfoContent">
                    <!-- 格子資訊將在這裡顯示 -->
                </div>
                <div class="mt-3" id="tileActions">
                    <!-- 操作按鈕將在這裡顯示 -->
                </div>
            </div>
        </div>

        <!-- 地形管理 -->
        <div class="module-card mb-3">
            <div class="module-header">
                <h5><i class="fas fa-map me-2"></i>地形管理</h5>
            </div>
            <div class="module-body">
                <form id="terrainForm">
                    <div class="mb-3">
                        <label class="form-label">地形類型</label>
                        <select class="form-select" id="terrainType">
                            <option value="plain">平原</option>
                            <option value="forest">森林</option>
                            <option value="mountain">山脈</option>
                            <option value="iron_mine">鐵礦</option>
                            <option value="stone_mine">石礦</option>
                            <option value="waterfront">水岸</option>
                            <option value="river">河流</option>
                            <option value="grassland">草原</option>
                            <option value="desert">沙漠</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">座標 X</label>
                        <input type="number" class="form-control" id="terrainX" min="0" max="9" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">座標 Y</label>
                        <input type="number" class="form-control" id="terrainY" min="0" max="9" value="0">
                    </div>
                    <button type="button" class="btn btn-module btn-primary" onclick="setTerrain()">
                        <i class="fas fa-edit me-2"></i>設定地形
                    </button>
                    <button type="button" class="btn btn-module btn-info ms-2" onclick="getTerrain()">
                        <i class="fas fa-search me-2"></i>查詢地形
                    </button>
                </form>
            </div>
        </div>

        <!-- 地形統計 -->
        <div class="module-card">
            <div class="module-header">
                <h5><i class="fas fa-layer-group me-2"></i>地形統計</h5>
            </div>
            <div class="module-body">
                <div id="terrainStats">
                    <div class="d-flex justify-content-between mb-2">
                        <span>平原:</span>
                        <span id="plainCount">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>森林:</span>
                        <span id="forestCount">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>山脈:</span>
                        <span id="mountainCount">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>鐵礦:</span>
                        <span id="iron_mineCount">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>石礦:</span>
                        <span id="stone_mineCount">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>水岸:</span>
                        <span id="waterfrontCount">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>河流:</span>
                        <span id="riverCount">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>草原:</span>
                        <span id="grasslandCount">0</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>沙漠:</span>
                        <span id="desertCount">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 地形配置資訊 -->
<div class="module-card mt-3">
    <div class="module-header">
        <h5><i class="fas fa-cogs me-2"></i>地形配置資訊</h5>
    </div>
    <div class="module-body">
        <div id="terrainConfigInfo">
            <p class="text-muted">點擊按鈕載入地形配置資訊</p>
        </div>
        <button type="button" class="btn btn-module btn-info" onclick="loadTerrainConfig()">
            <i class="fas fa-sync me-2"></i>載入地形配置
        </button>
    </div>
</div>
